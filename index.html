<!DOCTYPE html>

{
  "name": "Team Overview Gantt",
  "schemaVersion": 1,
  "description": "Team Overview Gantt chart for Q2/Q3 2026 — Mob, Web and BE roadmap with frozen feature columns, a scrollable timeline pinned on today, sticky team headers, a completed-work toggle, and click-through Jira ticket breakdowns."
}
</script>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Roadmap · Tread Athletics</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg:#0d0d0c; --panel:#111110; --panel-2:#1c1c1b; --line:#292928; --line-2:#3d3d3c;
      --dim:#585856; --mid:#979795; --text:#bcbbb7; --bright:#f7f6f2; --gold:#d6c281; --green:#3d6b52;
      --left-w:452px; --hdr-h:56px; --col-h:56px; --team-h:36px; --row-h:40px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--bright);
      display: flex; flex-direction: column;
    }

    /* ── Page header ───────────────────────────────────────── */
    .page-header {
      flex: 0 0 var(--hdr-h); height: var(--hdr-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; background: var(--panel-2);
      border-bottom: 1px solid var(--line); z-index: 400;
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 14px; }
    .header-right { gap: 10px; }
    .tread-logo svg { height: 26px; width: auto; display: block; }
    .header-divider { width: 1px; height: 20px; background: var(--line); }
    .header-title { font-size: 14px; font-weight: 500; color: var(--mid); }

    .pill {
      height: 26px; padding: 0 11px; border-radius: 9999px;
      border: 1px solid var(--line); background: transparent;
      font-size: 12px; font-weight: 500; color: var(--gold);
      display: flex; align-items: center; gap: 7px;
      font-family: inherit;
    }
    button.pill { cursor: pointer; transition: border-color .12s, color .12s; }
    button.pill:hover { border-color: var(--line-2); }
    .ll-badge {
      height: 26px; padding: 0 11px; border-radius: 9999px; border: 1px solid var(--line);
      font-size: 11px; font-weight: 600; color: var(--mid);
      letter-spacing: .5px; text-transform: uppercase; display: flex; align-items: center;
    }

    /* completed toggle */
    .toggle { color: var(--mid); }
    .toggle .sw {
      width: 28px; height: 15px; border-radius: 9999px;
      background: var(--line-2); position: relative; transition: background .15s;
    }
    .toggle .sw::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--dim); transition: transform .15s, background .15s;
    }
    .toggle.on { color: var(--gold); border-color: #55503c; }
    .toggle.on .sw { background: #55503c; }
    .toggle.on .sw::after { transform: translateX(13px); background: var(--gold); }
    .toggle .count { color: var(--dim); font-variant-numeric: tabular-nums; }

    /* ── Scroll viewport: the only thing that scrolls ──────── */
    .board {
      flex: 1 1 auto; overflow: auto; position: relative;
      background: var(--panel);
      scrollbar-color: var(--line-2) transparent;
    }
    .rows { width: max-content; min-width: 100%; position: relative; }

    /* frozen left block, shared by every row type */
    .rl {
      position: sticky; left: 0; z-index: 5;
      width: var(--left-w); min-width: var(--left-w);
      display: flex; align-items: stretch;
      background: var(--panel);
    }
    .rl::after {
      content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 1px;
      background: var(--line-2);
    }
    .board.scrolled-x .rl::after { box-shadow: 6px 0 14px rgba(0,0,0,.55); }

    .c-name  { width: 260px; min-width: 260px; }
    .c-dur   { width: 40px;  min-width: 40px; }
    .c-start { width: 76px;  min-width: 76px; }
    .c-end   { width: 76px;  min-width: 76px; }

    /* ── Column header ─────────────────────────────────────── */
    .col-header {
      position: sticky; top: 0; z-index: 30;
      display: flex; height: var(--col-h);
      background: var(--panel-2); border-bottom: 1px solid var(--line);
    }
    .col-header .rl { background: var(--panel-2); z-index: 6; }
    .ch {
      padding: 0 12px 8px; font-size: 11px; font-weight: 600;
      letter-spacing: .8px; text-transform: uppercase; color: var(--dim);
      display: flex; align-items: flex-end;
    }
    .ch-center { justify-content: center; }
    .timeline-header { position: relative; background: var(--panel-2); }
    .month-strip { position: absolute; top: 0; left: 0; right: 0; height: 28px; }
    .month-block { position: absolute; top: 0; height: 28px; display: flex; align-items: center; padding-left: 10px; }
    .month-block-label {
      position: sticky; left: 462px; display: inline-block;
      font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text);
    }
    .month-sep { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
    .week-strip { position: absolute; bottom: 0; left: 0; right: 0; height: 26px; border-top: 1px solid var(--line); }
    .week-tick {
      position: absolute; bottom: 0; height: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 500; color: var(--dim);
    }
    .today-header-mark {
      position: absolute; bottom: -2px; transform: translateX(-50%);
      font-size: 8px; font-weight: 700; letter-spacing: .5px;
      color: var(--gold); text-transform: uppercase;
    }

    /* ── Team section ──────────────────────────────────────── */
    .team-section { position: relative; }
    .team-row {
      position: sticky; top: var(--col-h); z-index: 20;
      display: flex; height: var(--team-h);
      background: var(--panel-2);
      border-top: 2px solid var(--line-2); border-bottom: 1px solid var(--line);
    }
    .team-row .rl {
      background: var(--panel-2); z-index: 6;
      align-items: center; padding: 0 16px 0 12px; gap: 10px;
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text); border-left: 3px solid var(--gold);
    }
    .team-count {
      margin-left: auto; letter-spacing: .4px; font-weight: 600;
      font-size: 9.5px; color: var(--dim); font-variant-numeric: tabular-nums;
    }
    .team-chart-bg { position: relative; background: var(--panel-2); }

    /* ── Task rows ─────────────────────────────────────────── */
    .task-row { display: flex; height: var(--row-h); border-bottom: 1px solid var(--line); cursor: pointer; }
    .task-row:nth-of-type(even) { background: var(--panel-2); }
    .task-row:nth-of-type(even) .rl { background: var(--panel-2); }
    .task-row:hover, .task-row:hover .rl { background: #232322; }
    .task-row.selected, .task-row.selected .rl { background: #2a2820; }
    .task-row.is-child .c-name { padding-left: 38px; }
    .task-row.is-child .c-name::before {
      content: ''; position: absolute; left: 26px; top: 0; bottom: 0;
      width: 1px; background: var(--line-2);
    }

    .c-name {
      position: relative; padding: 0 12px 0 20px;
      font-size: 12px; font-weight: 400; color: var(--text);
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap; overflow: hidden;
    }
    .c-name .label { overflow: hidden; text-overflow: ellipsis; }
    .tick { color: #5a9b74; font-size: 11px; flex: 0 0 auto; }
    .chev {
      flex: 0 0 auto; width: 14px; height: 14px; margin-left: -14px; margin-right: 2px;
      display: flex; align-items: center; justify-content: center;
      color: var(--dim); font-size: 9px; transition: transform .15s;
    }
    .task-row.open .chev { transform: rotate(90deg); }
    .status-tag {
      flex: 0 0 auto; font-size: 8px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase; border-radius: 4px; padding: 1px 4px;
      color: var(--gold); border: 1px solid #55503c;
    }
    .status-tag.blocked { color: #c98b7a; border-color: #5c3a31; }
    .note-mark { white-space: pre-line; }
    .note-mark {
      flex: 0 0 auto; width: 13px; height: 13px; border-radius: 50%;
      border: 1px solid var(--line-2); color: var(--dim);
      font-size: 8.5px; font-weight: 700; font-style: normal;
      display: flex; align-items: center; justify-content: center; cursor: help;
    }
    .task-row:hover .note-mark { border-color: var(--gold); color: var(--gold); }
    .est-tag {
      flex: 0 0 auto; font-size: 8px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase; color: var(--dim);
      border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 4px;
    }
    .n-tickets {
      flex: 0 0 auto; margin-left: auto; margin-right: 2px;
      font-size: 9.5px; font-weight: 600; color: var(--dim);
      font-variant-numeric: tabular-nums;
      border: 1px solid var(--line); border-radius: 9999px; padding: 1px 6px;
      display: flex; align-items: center; gap: 3px;
    }
    .task-row:hover .n-tickets { border-color: var(--line-2); color: var(--mid); }
    .c-dur { font-size: 11px; color: var(--dim); display: flex; align-items: center; justify-content: center; }
    .c-start, .c-end {
      padding: 0 10px; font-size: 10.5px; color: var(--dim);
      display: flex; align-items: center; font-variant-numeric: tabular-nums;
    }
    .task-chart-cell { position: relative; }

    /* ── Grid + today ──────────────────────────────────────── */
    .grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); pointer-events: none; }
    .grid-line-month { background: var(--line-2); }
    .today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bright); pointer-events: none; z-index: 10; }

    /* ── Bars ──────────────────────────────────────────────── */
    .gantt-bar {
      position: absolute; top: 50%; transform: translateY(-50%);
      height: 20px; border-radius: 8px; z-index: 2; min-width: 4px;
      transition: opacity .1s, box-shadow .1s;
    }
    .gantt-bar.active { background: var(--gold); }
    .gantt-bar.future { background: var(--line-2); border: 1px solid var(--dim); }
    .gantt-bar.past   { background: var(--line); border: 1px solid var(--line-2); }
    .gantt-bar.done   { background: var(--green); }
    .gantt-bar.est    { opacity: .8; border: 1px dashed var(--dim); }
    .gantt-bar.blocked {
      background: repeating-linear-gradient(-45deg, #59392e 0 5px, #402921 5px 10px);
      border: 1px solid #6b4437;
    }
    .task-row:hover .gantt-bar { opacity: .85; }
    .task-row.selected .gantt-bar { box-shadow: 0 0 0 2px rgba(214,194,129,.5); }

    /* ── Legend ────────────────────────────────────────────── */
    .legend {
      flex: 0 0 auto; display: flex; align-items: center; gap: 24px;
      padding: 13px 20px; background: var(--panel-2); border-top: 1px solid var(--line);
      font-size: 11px; font-weight: 500; color: var(--dim);
    }
    .li { display: flex; align-items: center; gap: 7px; }
    .li-swatch { width: 20px; height: 10px; border-radius: 4px; }
    .li-swatch.active { background: var(--gold); }
    .li-swatch.future { background: var(--line-2); border: 1px solid var(--dim); }
    .li-swatch.past   { background: var(--line); border: 1px solid var(--line-2); }
    .li-swatch.done   { background: var(--green); }
    .li-today-line { width: 2px; height: 14px; background: var(--bright); border-radius: 1px; }
    .legend-right { margin-left: auto; font-size: 11px; font-weight: 400; color: var(--line-2); letter-spacing: .3px; }

    /* ── Ticket drawer ─────────────────────────────────────── */
    .scrim {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 500;
    }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 92vw;
      background: var(--panel); border-left: 1px solid var(--line-2);
      transform: translateX(100%); transition: transform .2s ease;
      z-index: 501; display: flex; flex-direction: column;
      box-shadow: -18px 0 40px rgba(0,0,0,.5);
    }
    .drawer.show { transform: none; }
    .dw-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
    .dw-eyebrow {
      display: flex; align-items: center; gap: 8px;
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
    }
    .dw-title { font-size: 17px; font-weight: 600; color: var(--bright); line-height: 1.3; padding-right: 28px; }
    .dw-close {
      position: absolute; top: 16px; right: 16px; width: 26px; height: 26px;
      border: 1px solid var(--line); border-radius: 7px; background: transparent;
      color: var(--mid); cursor: pointer; font-size: 14px; line-height: 1;
      display: flex; align-items: center; justify-content: center; font-family: inherit;
    }
    .dw-close:hover { border-color: var(--line-2); color: var(--bright); }
    .dw-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 11px; color: var(--dim); }
    .dw-meta b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
    .dw-note-line {
      flex: 1 0 100%; margin-top: 2px; white-space: pre-line;
      font-size: 11px; line-height: 1.6; color: var(--mid);
    }
    .dw-note-line.is-blocked { color: #c98b7a; }
    .dw-epics { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .epic-chip {
      font-size: 10.5px; color: var(--gold); text-decoration: none;
      border: 1px solid #55503c; border-radius: 6px; padding: 3px 8px;
    }
    .epic-chip:hover { background: rgba(214,194,129,.08); }

    .dw-progress { margin-top: 14px; }
    .dw-bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
    .dw-bar i { display: block; height: 100%; }
    .dw-bar .p-done { background: var(--green); }
    .dw-bar .p-prog { background: var(--gold); }
    .dw-legend { margin-top: 7px; font-size: 10.5px; color: var(--dim); }

    .dw-body { flex: 1; overflow: auto; padding: 6px 0 24px; }
    .dw-note {
      margin: 14px 20px 4px; padding: 9px 11px; border-radius: 8px;
      background: rgba(214,194,129,.06); border: 1px solid #38352a;
      font-size: 11px; line-height: 1.5; color: var(--mid);
    }
    .grp-head {
      position: sticky; top: 0; z-index: 2; background: var(--panel);
      padding: 16px 20px 7px; font-size: 10px; font-weight: 700;
      letter-spacing: 1.1px; text-transform: uppercase; color: var(--dim);
      display: flex; gap: 8px; align-items: baseline;
    }
    .grp-head span { color: var(--line-2); letter-spacing: 0; font-weight: 500; text-transform: none; }
    .grp-link {
      margin-left: auto; font-size: 10px; color: var(--gold);
      text-decoration: none; letter-spacing: 0; font-weight: 500; text-transform: none;
    }
    .grp-link:hover { text-decoration: underline; }
    .grp-desc {
      padding: 0 20px 10px; font-size: 11.5px; line-height: 1.55; color: var(--mid);
    }
    .tk {
      display: flex; gap: 10px; padding: 8px 20px;
      border-bottom: 1px solid #1e1e1d; text-decoration: none;
    }
    .tk:hover { background: var(--panel-2); }
    .tk-key { flex: 0 0 92px; font-size: 10.5px; color: var(--gold); font-variant-numeric: tabular-nums; padding-top: 1px; }
    .tk-main { flex: 1; min-width: 0; }
    .tk-sum { font-size: 12px; color: var(--text); line-height: 1.4; }
    .tk-sub { margin-top: 4px; display: flex; gap: 8px; align-items: center; font-size: 10px; color: var(--dim); }
    .st {
      border-radius: 4px; padding: 1px 6px; font-size: 9.5px; font-weight: 600;
      letter-spacing: .3px; white-space: nowrap;
    }
    .st.done { background: rgba(61,107,82,.28); color: #7fb894; }
    .st.indeterminate { background: rgba(214,194,129,.16); color: var(--gold); }
    .st.new { background: #232322; color: var(--mid); }
    .dw-empty { padding: 40px 24px; text-align: center; font-size: 12px; color: var(--dim); line-height: 1.6; }
  </style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════
   Data
   ═══════════════════════════════════════════════════════════ */
const DATA    = JSON.parse(document.getElementById('roadmap-data').textContent);
const TEAMS   = DATA.teams;
// key -> [summary, status, statusCategory, assignee, fixVersion]
const TICKETS = DATA.tickets;
const JIRA    = 'https://launch-labs.atlassian.net/browse/';

/* ══════════════════════════════════════════════════════════════
   Timeline geometry — spans every task on the board plus padding,
   so past months are reachable by scrolling instead of clipped off.
   ═══════════════════════════════════════════════════════════ */
const PX = 7.5;
const MS = 86400000;
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MO_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function toDate(s) { return new Date(s + 'T00:00:00'); }

const allTasks = [];
TEAMS.forEach(t => t.tasks.forEach(x => { allTasks.push(x); (x.children || []).forEach(c => allTasks.push(c)); }));

const _today = new Date();
const TODAY = new Date(_today.getFullYear(), _today.getMonth(), _today.getDate());
const minTask = new Date(Math.min(...allTasks.map(t => +toDate(t.start)), +TODAY));
const maxTask = new Date(Math.max(...allTasks.map(t => +toDate(t.end)),   +TODAY));
// pad to whole months either side
const TIMELINE_START = new Date(minTask.getFullYear(), minTask.getMonth() - 1, 1);
const TIMELINE_END   = new Date(maxTask.getFullYear(), maxTask.getMonth() + 2, 1);

function dayOff(d) { return Math.round(((typeof d === 'string' ? toDate(d) : d) - TIMELINE_START) / MS); }
function px(d) { return d * PX; }

const TOTAL_DAYS = dayOff(TIMELINE_END);
const CHART_W    = px(TOTAL_DAYS);
const TODAY_OFF  = dayOff(TODAY);
const LEFT_W     = 452;

document.getElementById('today-badge').textContent =
  'Today   ' + MO[TODAY.getMonth()] + ' ' + TODAY.getDate() + ', ' + TODAY.getFullYear();
{
  const last = new Date(+TIMELINE_END - MS);
  const a = MO_LONG[TIMELINE_START.getMonth()] + ' ' + TIMELINE_START.getFullYear();
  const b = MO_LONG[last.getMonth()] + ' ' + last.getFullYear();
  document.getElementById('legend-right').textContent = a + '  →  ' + b;
}

// months
const MONTHS = [];
for (let d = new Date(TIMELINE_START); d < TIMELINE_END; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
  MONTHS.push({ label: MO_LONG[d.getMonth()], start: new Date(d), end: new Date(d.getFullYear(), d.getMonth() + 1, 1) });
}
// week ticks, anchored to Mondays
const WEEKS = [];
{
  let w = new Date(TIMELINE_START);
  w.setDate(w.getDate() + ((8 - w.getDay()) % 7));
  for (; w < TIMELINE_END; w = new Date(+w + 7 * MS)) WEEKS.push(new Date(w));
}

function fmtDate(s) { const d = toDate(s); return MO[d.getMonth()] + ' ' + d.getDate(); }

function barStatus(task) {
  if (task.done) return 'done';
  const s = dayOff(task.start), e = dayOff(task.end);
  if (e < TODAY_OFF) return 'past';
  if (s <= TODAY_OFF) return 'active';
  return 'future';
}

/* Live work first, then upcoming, then finished — completed work is
   what Natalie wanted out of the way, so it sinks to the bottom. */
const RANK = { active: 0, future: 1, past: 2, done: 3 };
function sortTasks(tasks) {
  return tasks.slice().sort((a, b) => {
    const ra = RANK[barStatus(a)], rb = RANK[barStatus(b)];
    if (ra !== rb) return ra - rb;
    const sa = dayOff(a.start), sb = dayOff(b.start);
    if (sa !== sb) return sa - sb;
    return dayOff(a.end) - dayOff(b.end);
  });
}

/* ══════════════════════════════════════════════════════════════
   Build
   ═══════════════════════════════════════════════════════════ */
const root  = document.getElementById('gantt-root');
const board = document.getElementById('board');

function makeOverlay() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;inset:0;pointer-events:none';
  MONTHS.forEach((m, i) => {
    if (i === 0) return;
    const line = document.createElement('div');
    line.className = 'grid-line grid-line-month';
    line.style.left = px(dayOff(m.start)) + 'px';
    wrap.appendChild(line);
  });
  WEEKS.forEach(w => {
    if (w.getDate() === 1) return;
    const line = document.createElement('div');
    line.className = 'grid-line';
    line.style.left = px(dayOff(w)) + 'px';
    wrap.appendChild(line);
  });
  const tl = document.createElement('div');
  tl.className = 'today-line';
  tl.style.left = px(TODAY_OFF) + 'px';
  wrap.appendChild(tl);
  return wrap;
}

// ── column header ──
const colHdr = document.createElement('div');
colHdr.className = 'col-header';
const hdrLeft = document.createElement('div');
hdrLeft.className = 'rl';
hdrLeft.innerHTML =
  '<div class="ch c-name">Feature</div>' +
  '<div class="ch c-dur ch-center">d</div>' +
  '<div class="ch c-start">Start</div>' +
  '<div class="ch c-end">End</div>';
colHdr.appendChild(hdrLeft);

const tlHdr = document.createElement('div');
tlHdr.className = 'timeline-header';
tlHdr.style.width = CHART_W + 'px';

const monthStrip = document.createElement('div');
monthStrip.className = 'month-strip';
MONTHS.forEach((m, i) => {
  const a = dayOff(m.start), b = dayOff(m.end);
  const block = document.createElement('div');
  block.className = 'month-block';
  block.style.left  = px(a) + 'px';
  block.style.width = px(b - a) + 'px';
  block.innerHTML = '<span class="month-block-label">' + m.label + '</span>';
  monthStrip.appendChild(block);
  if (i > 0) {
    const sep = document.createElement('div');
    sep.className = 'month-sep';
    sep.style.left = px(a) + 'px';
    monthStrip.appendChild(sep);
  }
});
tlHdr.appendChild(monthStrip);

const weekStrip = document.createElement('div');
weekStrip.className = 'week-strip';
WEEKS.forEach(w => {
  const tick = document.createElement('div');
  tick.className = 'week-tick';
  tick.style.left  = px(dayOff(w)) + 'px';
  tick.style.width = px(7) + 'px';
  tick.textContent = w.getDate();
  weekStrip.appendChild(tick);
});
const todayLbl = document.createElement('div');
todayLbl.className = 'today-header-mark';
todayLbl.style.left = px(TODAY_OFF) + 'px';
todayLbl.textContent = 'today';
weekStrip.appendChild(todayLbl);
tlHdr.appendChild(weekStrip);
colHdr.appendChild(tlHdr);
root.appendChild(colHdr);

// ── rows ──
let doneCount = 0;

function makeRow(task, team, isChild) {
  const status = barStatus(task);
  const row = document.createElement('div');
  row.className = 'task-row' + (isChild ? ' is-child' : '') + (task.done ? ' is-done' : '');
  row.dataset.startOff = dayOff(task.start);
  if (task.done) doneCount++;

  const left = document.createElement('div');
  left.className = 'rl';

  const nTickets = task.jira ? task.jira.keys.length : 0;
  const name = document.createElement('div');
  name.className = 'c-name';
  name.innerHTML =
    (task.children ? '<span class="chev">▶</span>' : '') +
    (task.done ? '<span class="tick">✓</span>' : '') +
    '<span class="label" title="' + esc(task.note ? task.name + ' — ' + task.note : task.name) + '">' + esc(task.name) + '</span>' +
    (task.tag || task.blocked
      ? '<span class="status-tag' + (task.blocked ? ' blocked' : '') + '" title="' + esc(task.note || '') + '">'
        + esc(task.tag || 'blocked') + '</span>'
      : task.note ? '<i class="note-mark" title="' + esc(task.note) + '">i</i>' : '') +
    (task.est ? '<span class="est-tag" title="Dates split from the parent feature — adjust as needed">est</span>' : '') +
    (nTickets ? '<span class="n-tickets" title="' + nTickets + ' Jira tickets — click the row to see them">'
      + nTickets + '<svg width="7" height="7" viewBox="0 0 8 8" aria-hidden="true"><path d="M2 1l4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' : '');

  const dur = document.createElement('div');
  dur.className = 'c-dur';
  dur.textContent = task.dur;

  const st = document.createElement('div');
  st.className = 'c-start';
  st.textContent = fmtDate(task.start);

  const en = document.createElement('div');
  en.className = 'c-end';
  en.textContent = fmtDate(task.end);

  left.append(name, dur, st, en);

  const chart = document.createElement('div');
  chart.className = 'task-chart-cell';
  chart.style.width = CHART_W + 'px';
  chart.appendChild(makeOverlay());

  const bar = document.createElement('div');
  bar.className = 'gantt-bar ' + status + (task.est ? ' est' : '') + (task.blocked ? ' blocked' : '');
  if (task.note) bar.title = task.note;
  const a = dayOff(task.start), b = dayOff(task.end);
  bar.style.left  = px(a) + 'px';
  bar.style.width = Math.max(px(b - a + 1), 6) + 'px';
  chart.appendChild(bar);

  row.append(left, chart);
  row.addEventListener('click', e => {
    if (task.children && e.target.closest('.chev')) { toggleChildren(row); return; }
    openDrawer(task, team, status);
  });
  return row;
}

function toggleChildren(row) {
  row.classList.toggle('open');
  const open = row.classList.contains('open');
  let n = row.nextElementSibling;
  while (n && n.classList.contains('is-child')) {
    n.dataset.parentOpen = open ? '1' : '0';
    n = n.nextElementSibling;
  }
  applyFilter();
}

TEAMS.forEach(team => {
  const section = document.createElement('section');
  section.className = 'team-section';

  const teamRow = document.createElement('div');
  teamRow.className = 'team-row';
  const tl = document.createElement('div');
  tl.className = 'rl';
  tl.innerHTML = '<span>' + esc(team.name) + '</span><span class="team-count" data-team="' + team.key + '"></span>';
  const tc = document.createElement('div');
  tc.className = 'team-chart-bg';
  tc.style.width = CHART_W + 'px';
  tc.appendChild(makeOverlay());
  teamRow.append(tl, tc);
  section.appendChild(teamRow);

  sortTasks(team.tasks).forEach(task => {
    section.appendChild(makeRow(task, team, false));
    (task.children || []).forEach(child => {
      const r = makeRow(child, team, true);
      r.dataset.parentOpen = '0';
      section.appendChild(r);
    });
  });

  root.appendChild(section);
});

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ══════════════════════════════════════════════════════════════
   Completed-work toggle
   ═══════════════════════════════════════════════════════════ */
const toggle = document.getElementById('done-toggle');
let showDone = false;
document.getElementById('done-count').textContent = doneCount;

function applyFilter() {
  document.querySelectorAll('.task-row').forEach(r => {
    const isChild = r.classList.contains('is-child');
    const hidden = isChild
      ? r.dataset.parentOpen !== '1'                       // sub-rows follow the parent only
      : r.classList.contains('is-done') && !showDone;      // top-level rows follow the toggle
    r.style.display = hidden ? 'none' : '';
  });
  document.querySelectorAll('.team-section').forEach(sec => {
    const rows  = [...sec.querySelectorAll('.task-row:not(.is-child)')];
    const shown = rows.filter(r => r.style.display !== 'none').length;
    const el = sec.querySelector('.team-count');
    el.textContent = showDone ? rows.length + ' features' : shown + ' of ' + rows.length;
  });
}
toggle.addEventListener('click', () => {
  showDone = !showDone;
  toggle.classList.toggle('on', showDone);
  toggle.setAttribute('aria-pressed', String(showDone));
  applyFilter();
  anchorScroll(true);
});
applyFilter();

/* ══════════════════════════════════════════════════════════════
   Ticket drawer
   ═══════════════════════════════════════════════════════════ */
const drawer = document.getElementById('drawer');
const scrim  = document.getElementById('scrim');
const STATUS_LABEL = { active: 'In progress', future: 'Upcoming', past: 'Past end date', done: 'Done' };

function openDrawer(task, team, status) {
  document.querySelectorAll('.task-row.selected').forEach(r => r.classList.remove('selected'));
  [...document.querySelectorAll('.task-row')]
    .find(r => r.querySelector('.label') && r.querySelector('.label').textContent === task.name)
    ?.classList.add('selected');

  document.getElementById('dw-eyebrow').textContent = team.name.replace(/\s+·\s+/, ' · ') + '  ·  ' + STATUS_LABEL[status];
  document.getElementById('dw-title').textContent = task.name;
  document.getElementById('dw-meta').innerHTML =
    '<div>Start <b>' + fmtDate(task.start) + '</b></div>' +
    '<div>End <b>' + fmtDate(task.end) + '</b></div>' +
    '<div>Duration <b>' + task.dur + 'd</b></div>' +
    (task.est ? '<div style="color:#55503c">dates estimated</div>' : '') +
    (task.note ? '<div class="dw-note-line' + (task.blocked ? ' is-blocked' : '') + '">' + esc(task.note) + '</div>' : '');

  const j = task.jira;
  const epicsEl = document.getElementById('dw-epics');
  epicsEl.innerHTML = j && j.epics.length
    ? j.epics.map(e => '<a class="epic-chip" target="_blank" rel="noopener" href="' + JIRA + e[0] + '">' +
        esc(e[0]) + (e[1] ? ' · ' + esc(e[1]) : '') + '</a>').join('')
    : '';

  const keys = j ? j.keys : [];
  const prog = document.getElementById('dw-progress');
  const body = document.getElementById('dw-body');

  if (!keys.length) {
    prog.innerHTML = '';
    body.innerHTML = '<div class="dw-empty">No Jira tickets are linked to this feature yet.<br>' +
      'Add its epic to the mapping and the breakdown will appear here.</div>';
  } else {
    const done = keys.filter(k => TICKETS[k][2] === 'done').length;
    const prg  = keys.filter(k => TICKETS[k][2] === 'indeterminate').length;
    prog.innerHTML =
      '<div class="dw-bar">' +
        '<i class="p-done" style="width:' + (done / keys.length * 100) + '%"></i>' +
        '<i class="p-prog" style="width:' + (prg / keys.length * 100) + '%"></i>' +
      '</div>' +
      '<div class="dw-legend">' + done + ' done · ' + prg + ' in progress · ' +
        (keys.length - done - prg) + ' to do  —  ' + keys.length + ' tickets</div>';

    // explicit iteration groups when the feature defines them, otherwise by release
    let ordered, descs = {}, links = {};
    if (j.groups && j.groups.length) {
      ordered = j.groups.map(g => [g.label, g.keys]);
      j.groups.forEach(g => { if (g.desc) descs[g.label] = g.desc; if (g.link) links[g.label] = g.link; });
    } else {
      const groups = new Map();
      keys.forEach(k => {
        const g = TICKETS[k][4] || 'No release set';
        if (!groups.has(g)) groups.set(g, []);
        groups.get(g).push(k);
      });
      ordered = [...groups.entries()].sort((a, b) =>
        (a[0] === 'No release set') - (b[0] === 'No release set') || b[1].length - a[1].length);
    }

    let html = (j.scope === 'epic' && !j.groups)
      ? '<div class="dw-note">Showing every ticket in the linked epic — this feature\'s dates didn\'t narrow to a single release.</div>'
      : '';
    ordered.forEach(([g, ks]) => {
      html += '<div class="grp-head">' + esc(g) + '<span>' + ks.length + '</span>' +
        (links[g] ? '<a class="grp-link" target="_blank" rel="noopener" href="' + JIRA + links[g] + '">' + esc(links[g]) + '</a>' : '') +
        '</div>';
      if (descs[g]) html += '<div class="grp-desc">' + esc(descs[g]) + '</div>';
      ks.forEach(k => {
        const t = TICKETS[k];
        html += '<a class="tk" target="_blank" rel="noopener" href="' + JIRA + k + '">' +
          '<div class="tk-key">' + esc(k) + '</div>' +
          '<div class="tk-main"><div class="tk-sum">' + esc(t[0]) + '</div>' +
            '<div class="tk-sub"><span class="st ' + (t[2] || 'new') + '">' + esc(t[1]) + '</span>' +
            (t[3] ? '<span>' + esc(t[3]) + '</span>' : '') + '</div></div></a>';
      });
    });
    body.innerHTML = html;
  }
  body.scrollTop = 0;
  drawer.classList.add('show');
  drawer.setAttribute('aria-hidden', 'false');
  scrim.classList.add('show');
}

function closeDrawer() {
  drawer.classList.remove('show');
  drawer.setAttribute('aria-hidden', 'true');
  scrim.classList.remove('show');
  document.querySelectorAll('.task-row.selected').forEach(r => r.classList.remove('selected'));
}
document.getElementById('dw-close').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ══════════════════════════════════════════════════════════════
   Scroll: land on today, and keep a way back to it
   ═══════════════════════════════════════════════════════════ */
/* Today belongs near the left edge, not the middle: with completed work hidden
   there is nothing to see in the months behind it. The current month's first day
   becomes the leftmost column. Showing completed work reveals that history, so the
   view falls back to the earliest visible bar. */
const MONTH_START_OFF = dayOff(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));

function anchorLeftOff() {
  if (!showDone) return MONTH_START_OFF;
  const starts = [...document.querySelectorAll('.task-row')]
    .filter(r => r.style.display !== 'none')
    .map(r => +r.dataset.startOff);
  return starts.length ? Math.min(...starts) : MONTH_START_OFF;
}

function anchorScroll(smooth) {
  board.scrollTo({ left: Math.max(0, px(anchorLeftOff()) - 12), behavior: smooth ? 'smooth' : 'auto' });
}
document.getElementById('today-badge').addEventListener('click', () => anchorScroll(true));
board.addEventListener('scroll', () => board.classList.toggle('scrolled-x', board.scrollLeft > 0), { passive: true });
window.addEventListener('resize', () => anchorScroll(false));
anchorScroll(false);
</script>
</body>
